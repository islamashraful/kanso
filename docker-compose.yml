# Local development dependencies. Credentials here are local-only and
# deliberately plain; production values come from Secrets Manager.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanso
      POSTGRES_PASSWORD: kanso
      POSTGRES_DB: kanso
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the test database on first initialisation only.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanso -d kanso']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev and tests. Same POST Policy
  # API as real S3, so the presigned-post code path is identical here and
  # against AWS — only the client's endpoint/forcePathStyle config differs.
  # Real S3 gets wired up in Week 4.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kanso
      MINIO_ROOT_PASSWORD: kanso-minio
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the dev and test buckets, then exits. MinIO itself has
  # no "create this bucket on boot" option, unlike a real AWS account where
  # the bucket is provisioned once via Terraform/console ahead of time.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kanso kanso-minio &&
      mc mb --ignore-existing local/kanso-dev &&
      mc mb --ignore-existing local/kanso-test
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
