name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Integration tests run against real Postgres (docs/adr/0009). Locally that
    # is Docker Compose; here it is a service container. The database is named
    # kanso_test directly, since CI has no development database to keep apart.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kanso
          POSTGRES_PASSWORD: kanso
          POSTGRES_DB: kanso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanso -d kanso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The one real-Redis test (src/jobs/notifications.worker.test.ts) needs
      # this.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The runner has no .env.test, so anything src/config requires has to be set
    # here. The signing key is a literal rather than a repository secret: it
    # signs tokens that exist for the length of one job, and a secret would hide
    # from a contributor which values a run actually needs.
    env:
      DATABASE_URL: postgresql://kanso:kanso@localhost:5432/kanso_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: any-32-character-string-works-for-tests-here
      S3_BUCKET: kanso-test
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: kanso
      S3_SECRET_ACCESS_KEY: kanso-minio

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      # The generated client is gitignored, so it does not exist on a fresh
      # checkout. Typecheck and type-aware lint both need it, so this runs
      # before either.
      - name: Generate Prisma client
        run: bunx --bun prisma generate

      - name: Apply migrations
        run: bunx --bun prisma migrate deploy

      # S3-compatible object storage for src/lib/s3.test.ts, mirroring the
      # minio service in docker-compose.yml. This runs as a plain `docker run`
      # rather than a `services:` entry: GitHub Actions gives service
      # containers no way to pass a `command`, and minio/minio's default CMD
      # prints usage and exits without one — it needs `server /data` to
      # actually start.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kanso -e MINIO_ROOT_PASSWORD=kanso-minio \
            minio/minio:latest server /data
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
          docker run --rm --network host \
            -e MC_HOST_local=http://kanso:kanso-minio@localhost:9000 \
            minio/mc:latest mb --ignore-existing local/kanso-test

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run format:check

      - run: bun test

  docker:
    runs-on: ubuntu-latest
    # Only worth building if the code it packages actually passes — a broken
    # build's image would never be deployable anyway.
    needs: verify

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kanso
          POSTGRES_PASSWORD: kanso
          POSTGRES_DB: kanso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanso -d kanso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t kanso:ci .

      # Same reasoning and the same `--network host` MinIO needs above: a
      # container started directly on the runner reaches the service
      # containers' ports through the runner's own `localhost`, not through a
      # bridge network the runner isn't on.
      - name: Start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=kanso -e MINIO_ROOT_PASSWORD=kanso-minio \
            minio/minio:latest server /data
          timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      # Proves the image is not just buildable but actually runnable: it
      # starts, connects to real Postgres and Redis, and answers both health
      # endpoints — not just the liveness one Docker's own HEALTHCHECK uses.
      - name: Run the image and check it comes up healthy
        run: |
          docker run -d --name kanso --network host \
            -e DATABASE_URL="postgresql://kanso:kanso@localhost:5432/kanso" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="any-32-character-string-works-for-ci-here" \
            -e S3_BUCKET="kanso-ci" \
            -e S3_ENDPOINT="http://localhost:9000" \
            -e S3_FORCE_PATH_STYLE="true" \
            -e S3_ACCESS_KEY_ID="kanso" \
            -e S3_SECRET_ACCESS_KEY="kanso-minio" \
            kanso:ci

          timeout 30 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" kanso)" = "healthy" ]; do sleep 1; done' \
            || { docker logs kanso; exit 1; }

          curl -sf http://localhost:3000/health/ready | tee /dev/stderr | grep -q '"status":"ok"'

  # The reference as static files on GitHub Pages, so it can be read without
  # running the API. Gated on `verify` for the same reason the image is: the
  # suite is what proves the document describes the routes the app actually
  # serves, and a reference published past a red suite documents nothing
  # trustworthy. Pull requests build no page — there is one site, and it
  # should show main.
  pages:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    # The workflow-level group cancels superseded runs per ref, which is right
    # for tests and wrong for a deployment already in flight. This job opts out
    # into its own group instead.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      # No services, no migrations, no Prisma client and no env: the document
      # is derived from Zod schemas alone, and the schema modules' Prisma
      # imports are `import type`, erased before anything runs.
      - run: bun run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/reference

      - id: deploy
        uses: actions/deploy-pages@v5
